name: Bug report
description: Something in the plugin does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a **security vulnerability in the plugin itself**, do not use this form — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, and what did it do?
      placeholder: I ran /security-audit:audit on a Node project and ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smaller the reproduction, the faster the fix.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Node version
      placeholder: Windows 11 / Node 22.4.0
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Redact anything sensitive. Never paste a real credential.
      render: shell
