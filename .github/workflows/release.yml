name: Release

# Conventional-commit driven releases. release-please watches main, keeps a
# release pull request open with the accumulated changelog, and cuts a tag plus
# a GitHub release when that PR is merged.
#
# The refresh-intel workflow is designed to cooperate with this: a routine data
# refresh commits as `chore(data)` and never triggers a release, while a
# material intelligence change commits as `feat(intel)` and does.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # An app token (when configured) lets release-please's PR trigger CI so
      # the required checks run on it; otherwise the release PR needs an admin
      # merge. See refresh-intel.yml for the one-time GitHub App setup.
      - name: Mint an app token when configured
        id: app-token
        if: ${{ vars.BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify-release:
    name: Verify the cut release
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # This runs AFTER release-please has tagged and published the release, so
      # it is a post-publish smoke check, not a pre-publish gate: a failure here
      # flags a bad release loudly for a follow-up patch rather than blocking the
      # tag. (A true pre-publish gate would require release-please draft mode.)
      - name: Test
        shell: bash
        run: node --test tests/*.test.mjs

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin
        run: claude plugin validate . --strict

      - name: Confirm versions are in lockstep
        run: |
          node -e "
          const pkg = require('./package.json').version;
          const plugin = require('./.claude-plugin/plugin.json').version;
          const tag = '${{ needs.release-please.outputs.tag }}'.replace(/^v/, '');
          if (pkg !== plugin || pkg !== tag) {
            console.error('::error::version mismatch — package.json ' + pkg + ', plugin.json ' + plugin + ', tag ' + tag);
            process.exit(1);
          }
          console.log('All three agree on ' + pkg);
          "
