name: Refresh threat intelligence

# Keeps the vendored knowledge base current: CISA KEV, MITRE ATT&CK, the CWE
# Top 25, the CVSS v4 tables, and the tracked framework versions. Runs daily,
# opens (or updates) a single rolling pull request, and labels it so the release
# workflow can tell a routine data refresh from a material intelligence change.

on:
  schedule:
    # 05:17 UTC — deliberately off the top of the hour, which is heavily
    # contended and delays scheduled runs.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated feeds to refresh (kev,attack,cwe,cvss,frameworks). Empty = all.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Serialize, never cancel: a cancelled run can leave a half-written branch.
  group: refresh-intel
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # A pull request opened with the default GITHUB_TOKEN does NOT trigger the
      # `pull_request` workflows, so the required CI checks never run on the
      # refresh PR and it cannot be merged without an admin override. A GitHub
      # App installation token does trigger them. To enable it, create a GitHub
      # App with contents:write + pull-requests:write, install it on this repo,
      # and set the repo variable BOT_APP_ID and secret BOT_APP_PRIVATE_KEY.
      # Without those, this step is skipped and the PR falls back to
      # GITHUB_TOKEN (mergeable only by an admin).
      - name: Mint an app token when configured
        id: app-token
        if: ${{ vars.BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync intelligence feeds
        id: sync
        shell: bash
        env:
          # A token raises the GitHub API limit used for the framework-version
          # checks; the feeds themselves need no authentication.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # Passed through the environment, never interpolated into the shell, so
          # a dispatch input like `kev; rm -rf .` cannot inject a command.
          ONLY: ${{ github.event.inputs.only }}
        run: |
          node scripts/intel-sync.mjs ${ONLY:+--only "$ONLY"} --out ./intel

      - name: Run tests against refreshed data
        shell: bash
        run: node --test tests/*.test.mjs

      - name: Open or update the refresh pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # The app token (when configured) makes the PR trigger CI; otherwise
          # the default token is used and the PR needs an admin merge.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          # A fixed branch name makes the action idempotent: it updates one
          # rolling PR instead of opening a new one every day.
          branch: bot/intel-refresh
          delete-branch: true
          add-paths: |
            intel/**
          commit-message: >-
            ${{ steps.sync.outputs.material == 'true'
              && 'feat(intel): material threat-intelligence update'
              || 'chore(data): refresh threat intelligence feeds' }}
          title: >-
            ${{ steps.sync.outputs.material == 'true'
              && 'feat(intel): material threat-intelligence update'
              || 'chore(data): refresh threat intelligence feeds' }}
          # A `feat(intel)` commit is what the release workflow releases on; a
          # `chore(data)` commit refreshes the data without cutting a release.
          body: |
            Automated refresh of vendored threat intelligence.

            **Material change:** `${{ steps.sync.outputs.material }}`
            ${{ steps.sync.outputs.material == 'true' && '— new KEV entries, a new ATT&CK catalog, or a new CWE Top 25. This will cut a release when merged.' || '— routine data refresh. No release.' }}

            <details><summary>Sync summary</summary>

            ```json
            ${{ steps.sync.outputs.summary }}
            ```
            </details>

            Generated by the `refresh-intel` workflow. Review the diff before merging.
          labels: |
            automated
            threat-intel
            ${{ steps.sync.outputs.material == 'true' && 'release-worthy' || 'data-only' }}

      - name: Enable auto-merge for a routine data refresh
        # A data-only refresh is low-risk and already tested above, so let GitHub
        # merge it on its own once the required checks pass. Those checks only run
        # when the PR is opened with a trigger-capable token — the GitHub App
        # configured above. Without that token the checks never run, so auto-merge
        # simply waits and the PR still needs an admin merge. A material change
        # cuts a release, so it is deliberately left for a human to review.
        if: steps.sync.outputs.changed == 'true' && steps.sync.outputs.material != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: gh pr merge bot/intel-refresh --auto --squash

      - name: Report when nothing changed
        if: steps.sync.outputs.changed != 'true'
        run: echo "Feeds are already current; no pull request needed."
